<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Discovery Master Board</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js"></script>
</head>

<body>
  <header class="header">Discovery Master Board</header>

  <!-- 🟦 GRID LAYOUT -->
  <main class="dashboard-grid">

    <!-- 🟩 COLONNE GAUCHE -->
    <section class="dashboard-column">

      <!-- SYSTÈME -->
      <div class="card">
        <h3>Système</h3>
        <div class="switch-group">

          <label>WiFi :</label>
          <label class="switch">
            <input type="checkbox" id="wifi_on" onclick="wifi_on(this)">
            <span class="slider"></span>
          </label>

          <label>Discovery :</label>
          <label class="switch">
            <input type="checkbox" id="discovery_on" onclick="discovery_on(this)">
            <span class="slider"></span>
          </label>

          <!-- 🔥 Nouveau : Mode Test -->
          <label>Mode Test :</label>
          <label class="switch">
            <input type="checkbox" id="mode_test" onclick="mode_test(this)">
            <span class="slider"></span>
          </label>

        </div>
      </div>

      <!-- PROFIL VOIE -->
      <div class="card">
        <h3>Profil voie</h3>
        <div class="inline">
          <select id="track_profile">
            <option value="0">N (12V)</option>
            <option value="1">HO (15V)</option>
          </select>
          <button class="btn-blue" onclick="set_profile()">Appliquer</button>
        </div>
      </div>

      <!-- ÉTAT CAN -->
      <div class="card">
        <h3>État du bus CAN</h3>
        <div id="can_status" class="status">?</div>
      </div>

    </section>

    <!-- 🟦 COLONNE DROITE -->
    <section class="dashboard-column">

      <!-- SÉCURITÉ -->
      <div class="card center">
        <h3>Sécurité Discovery 2026</h3>

        <!-- Indicateur STOP -->
        <div id="stop_state" class="status">État : inconnu</div>

        <button class="btn-stop" onclick="send_stop()">STOP global</button>
        <button class="btn-clear" onclick="send_clear_stop()">CLEAR STOP</button>
      </div>

      <!-- SATELLITES -->
      <div class="card">
        <h3>Satellites découverts</h3>
        <div id="sat_list"></div>
      </div>

      <!-- ACTIONS GLOBALES -->
      <div class="card center">
        
        <!-- Indicateur sauvegarde -->
        <div id="save_state" class="status">Sauvegarde : en attente</div>

        <!-- Indicateur redémarrage -->
        <div id="restart_state" class="status">Redémarrage : en attente</div>

        <button class="btn-green" onclick="save()">Sauvegarder tous les nœuds</button>
        <button class="btn-red" onclick="restartEsp()">Redémarrer tous les nœuds</button>
      </div>

    </section>

  </main>
</body>
</html>
