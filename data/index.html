<!DOCTYPE html>
<html>

<head>
    <title>Discovery Master Board</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16X16" href="favicon.png">
    <link rel="stylesheet" type="text/css" href="w3.css">
    <script src="script.js" type="text/javascript"></script>

    <style>
        .status-box {
            padding: 10px;
            margin: 10px 0;
            color: white;
            font-weight: bold;
        }
        .sat-item {
            padding: 8px;
            margin: 5px;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

    <!--Titre-->
    <div class="w3-card w3-blue w3-padding-small w3-center">
        <h3>Locoduino : Discovery Master Board</h3>
    </div>

    <p class="w3-margin w3-center w3-padding-12">
        <span id='messages' class="w3-wide w3-text-red"></span>
    </p>

    <!-- ÉTATS GLOBAUX -->
    <div class="w3-margin w3-card w3-padding-24">
        <table width="80%" align="center">
            <tr>
                <td width="30%">Main ID :</td>
                <td width="20%">
                    <input id="idNode" name="idNode" size="10" type="text" value="254" disabled>
                </td>
                <td width="20%"></td>
                <td width="20%"></td>
            </tr>

            <tr>
                <td>Wifi (all) :</td>
                <td>
                    <input name="wifi_on" type="checkbox" id="wifi_on" onclick="wifi_on(this)">
                </td>

                <td>Discovery (all) :</td>
                <td>
                    <input name="discovery_on" type="checkbox" id="discovery_on" onclick="discovery_on(this)">
                </td>
            </tr>
        </table>
    </div>

    <!-- ÉTAT CAN -->
    <div class="w3-margin w3-card w3-padding-24">
        <h3>État du bus CAN</h3>
        <div id="can_status" class="status-box" style="background:#444;">?</div>
    </div>

    <!-- SATELLITES -->
    <div class="w3-margin w3-card w3-padding-24">
        <h3>Satellites découverts</h3>
        <div id="sat_list"></div>
    </div>

    <!-- BOUTONS -->
    <div class="w3-margin w3-card w3-padding-24" style="text-align: center">
        <button id="save" name="save" onclick="save(this)"
            class="w3-button w3-green w3-large w3-ripple" style="width:30%;">save all nodes</button>

        <button id="restartEsp" name="restartEsp" onclick="restartEsp(this)"
            class="w3-button w3-red w3-large w3-ripple" style="width:30%;">restart all nodes</button>
    </div>

    <div class="w3-margin">
        <a href="https://alkans.fr/locoduino/satellites_v2/document-pedagogique-signaux-regimes-exploitation-v1.pdf"
           target="_blank">Signaux :</a>
    </div>

    <!-- RAW DATA -->
    <div id="rawData" class="w3-margin w3-card w3-padding-24">Raw data</div>

</body>
</html>
